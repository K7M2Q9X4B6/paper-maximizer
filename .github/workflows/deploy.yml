# Build the static site from main and deploy it to GitHub Pages (#5).
# Runs after every push to main, and when intake starts it after publishing (bot commits do not
# trigger push workflows, nor do runs the resident dispatches). No secrets; Pages permissions only in this workflow.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Pages needs a public repository; skip quietly before that.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify the archive and build the site
        run: |
          python3 -B tools/archive.py
          python3 -B tools/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
