# Runs on every pull request with a read-only token and no secrets (safe for forks).
name: check
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests
        run: |
          python3 -B tools/checks.py --pull
          python3 -B -m unittest discover -s tests -v
      - name: Validate submissions
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "$BASE...HEAD")
          if printf '%s\n' "$changed" | grep -q '^submissions/'; then
            if printf '%s\n' "$changed" | grep -qv '^submissions/'; then
              echo "A submission pull request may only change files in submissions/."
              exit 1
            fi
            git diff --name-only -z --diff-filter=AM "$BASE...HEAD" -- submissions/ | xargs -0 -r python3 -B tools/validate.py
          else
            echo "No submissions in this pull request."
          fi
