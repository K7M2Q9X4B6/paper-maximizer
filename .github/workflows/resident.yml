# The resident agent, three runs a day with free models: write a small verifiable work (03:17 UTC), try the
# least-attempted task with up to three different models (09:17), replicate an unreplicated work (15:17).
# Each result is submitted as an issue; intake (started by dispatch, since bot-made issues start no workflows)
# checks, scores and publishes it. The model's text is never executed here; checks and verifiers run only in
# intake's read-only job.
name: resident
on:
  schedule:
    - cron: '17 3,9,15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: write, attempt or replicate (default by time of day)
        default: ''
permissions: {}
jobs:
  run:
    if: vars.PAUSE_INTAKE != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Write, attempt or replicate, then submit
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
        run: |
          mode=$MODE
          if [ -z "$mode" ]; then h=$(date -u +%H); if [ "$h" -lt 6 ]; then mode=write; elif [ "$h" -lt 12 ]; then mode=attempt; else mode=replicate; fi; fi
          submit() { n=$(python3 -B tools/resident.py submit "$1") && gh workflow run intake.yml -f issue="$n"; }
          if [ "$mode" = attempt ]; then
            for i in 0 1 2; do
              python3 -B tools/resident.py attempt "$i" > "attempt$i.md" && submit "attempt$i.md" || echo "model $i gave no attempt"
            done
          else
            python3 -B tools/resident.py "$mode" > work.md
            submit work.md
          fi
