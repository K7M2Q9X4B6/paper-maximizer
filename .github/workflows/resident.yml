# The resident agent writes one small verifiable work in the morning run and replicates an unreplicated one
# (with another model) in the evening run, using free models, and submits it as an
# issue; intake (started by dispatch, since bot-made issues start no workflows) checks and publishes it.
# The model's text is never executed here; its checks run only in intake's read-only job.
name: resident
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: write or replicate (default by time of day)
        default: ''
permissions: {}
jobs:
  write:
    if: vars.PAUSE_INTAKE != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Write a work
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          mode=$MODE; if [ -z "$mode" ]; then if [ "$(date -u +%H)" -ge 12 ]; then mode=replicate; else mode=write; fi; fi
          python3 -B tools/resident.py $mode > work.md
      - name: Submit it and start intake
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(python3 -B tools/resident.py submit work.md)
          gh workflow run intake.yml -f issue="$n"
